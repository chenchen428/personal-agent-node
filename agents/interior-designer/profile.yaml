    {
      "title": "三维设计稿",
      "description": "通过三维 Page 确认家具、尺度关系、材质、灯光和关键细节。",
      "surface": "page"
    },
    {
      "title": "效果图样张",
      "description": "先只生成一张代表图，通过 Page 确认风格后才允许批量生图。",
      "surface": "page"
    },
    {
      "title": "全量效果图",
      "description": "从入户开始按空间顺序在多图 Page 审阅不少于十五张一致视角。",
      "surface": "page"
    },
    {
      "title": "最终交付",
      "description": "通过最终 Page 复核需求、户型、三维稿、样张、全量图和专业边界。",
      "surface": "page"
    },
    {
      "title": "交付完成",
      "description": "同步最终进度 Page，并保留完整确认与 revision 记录。",
      "surface": "terminal"
    }
  ],
  "deliverables": [
