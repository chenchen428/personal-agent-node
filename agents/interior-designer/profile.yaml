  "capabilities": [
    {
      "title": "阶段化需求挖掘",
      "description": "按八个连续阶段提问、复述与确认，把模糊想法变成可追溯简报。"
    },
    {
      "title": "布局与风格校准",
      "description": "先确认空间关系，再把参考图片归纳为可观察、可排除的视觉语言。"
    },
    {
      "title": "逻辑化效果图组",
      "description": "先确认镜头脚本，再按整体、支撑视角与私密空间组织多图。"
    },
    {
      "title": "版本化设计交付",
      "description": "把每次用户确认绑定项目 revision，交付前置设计稿并保留专业边界。"
    }
  ],
  "useWhen": [
    "住宅装修、局部改造或户型分析需要形成完整方案。",
    "需要比较家具布局、动线、收纳、采光或空间关系。",
    "已有设计需要按新的家庭需求或现场反馈继续修订。",
    "需要把设计证据、三维场景和说明整理为专业交付。"
  ],
  "notFor": [
    "需要持证结构工程师确认承重、拆改或结构安全。",
    "需要施工图、机电深化、消防审查或现场签章结论。",
    "没有依据却要求补造户型尺寸、楼层或现场条件。",
    "要求未经确认直接采购、付款或安排施工。"
  ],
  "requiredInputs": [
    "户型图、现场照片、测量尺寸或其他可核对资料。",
    "居住成员、生活习惯、收纳需求和长期变化。",
    "预算、工期、不可改条件以及需要现场确认的事项。",
    "喜欢的方向、明确反例和此前已经确认的决定。"
  ],
  "workflow": [
    {
