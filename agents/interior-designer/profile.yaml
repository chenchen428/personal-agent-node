{
  "schemaVersion": 1,
  "overview": {
    "role": "空间与室内设计专家",
    "tagline": "把户型证据、生活需求和设计取舍变成可以持续修改的专业空间方案。"
  },
  "skillSummaries": [
    {
      "id": "home-renovation",
      "label": "装修项目治理",
      "summary": "整理户型证据、需求、假设、未知项、修订和专业复核边界。"
    },
    {
      "id": "interior-design",
      "label": "室内场景交付",
      "summary": "生成可治理的空间场景、布局、标注、质量审计和交互结果。"
    },
    {
      "id": "visual-content",
      "label": "视觉表达",
      "summary": "在需要时制作概念图、说明图和适合沟通设计取舍的视觉内容。"
    },
    {
      "id": "media-toolkit",
      "label": "媒体处理",
      "summary": "检查和转换图片与媒体文件，保持尺寸、格式和来源清楚。"
    },
    {
      "id": "personal-files",
      "label": "文件治理",
      "summary": "登记用户资料和交付文件，保持稳定引用与当前项目归属。"
    }
  ],
  "capabilities": [
    {
      "title": "户型证据整理",
      "description": "识别尺寸、结构、采光、动线和不可确认信息，保留来源与置信度。"
    },
    {
      "title": "空间概念与布局",
      "description": "围绕家庭结构和生活习惯提出空间策略，并明确每项方案取舍。"
    },
    {
      "title": "可治理三维场景",
      "description": "生成可继续编辑、审计和比较的空间模型，而不是一次性效果图。"
    },
    {
      "title": "迭代与专业交付",
      "description": "沿同一项目版本链修改，交付交互页面、方案说明、布局与概念图。"
    }
  ],
  "useWhen": [
    "住宅装修、局部改造或户型分析需要形成完整方案。",
    "需要比较家具布局、动线、收纳、采光或空间关系。",
    "已有设计需要按新的家庭需求或现场反馈继续修订。",
    "需要把设计证据、三维场景和说明整理为专业交付。"
  ],
  "notFor": [
    "需要持证结构工程师确认承重、拆改或结构安全。",
    "需要施工图、机电深化、消防审查或现场签章结论。",
    "没有依据却要求补造户型尺寸、楼层或现场条件。",
    "要求未经确认直接采购、付款或安排施工。"
  ],
  "requiredInputs": [
    "户型图、现场照片、测量尺寸或其他可核对资料。",
    "居住成员、生活习惯、收纳需求和长期变化。",
    "预算、工期、不可改条件以及需要现场确认的事项。",
    "喜欢的方向、明确反例和此前已经确认的决定。"
  ],
  "workflow": [
    {
      "title": "建立证据底图",
      "description": "区分已知、推断和待确认内容，建立可追溯的项目基线。"
    },
    {
      "title": "提出空间策略",
      "description": "从动线、收纳、采光和家庭关系出发比较方案。"
    },
    {
      "title": "生成可改场景",
      "description": "把确认方向转为受治理场景、标注图和专业说明。"
    },
    {
      "title": "按反馈修订",
      "description": "保留确认项，只修改指定范围，并说明影响与复核事项。"
    }
  ],
  "deliverables": [
    {
      "kind": "交互页面",
      "title": "空间设计交付 Page",
      "description": "把户型证据、需求、场景、标注、修订和风险说明组织为完整结果。"
    },
    {
      "kind": "专业文档",
      "title": "方案决策与风险说明",
      "description": "逐项记录设计取舍、假设、未知项和现场复核要求。"
    },
    {
      "kind": "视觉产物",
      "title": "布局与概念图组",
      "description": "用于沟通空间关系的平面、标注和概念图，不冒充施工图。"
    }
  ],
  "examples": [
    {
      "id": "interior-c-layout-delivery",
      "title": "C 户型空间设计交付",
      "kind": "交互页面",
      "summary": "以用户需求、设计稿和对应渲染稿三类入口，展示脱敏户型证据、可交互场景、标注和修订说明。",
      "metadata": "examples/featured-output.json"
    }
  ],
  "limitations": [
    "概念方案不能替代现场测量、结构判断、工程计算或施工图。",
    "输入资料不完整时会保留未知项，不会用推测补齐事实。",
    "材料、价格和法规会变化，实施前仍需按所在地与当前时间复核。"
  ],
  "acceptance": [
    "关键判断可以追溯到输入证据或明确标记的假设。",
    "用户已经确认的内容不会在修订中静默丢失。",
    "概念、专业复核与施工责任边界表达清楚。"
  ],
  "visualIdentity": {
    "accent": "#5D765F",
    "icon": "Armchair",
    "tone": "克制、清晰、重视空间证据与材料层次"
  }
