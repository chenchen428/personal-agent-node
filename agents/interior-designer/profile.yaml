    {
      "title": "版本化设计交付",
      "description": "把每次用户确认绑定项目 revision，交付前置设计稿并保留专业边界。"
    },
    {
      "title": "标准 Page 渲染闭环",
      "description": "同一能力生成设计册与独立 3D Page；3D 不重复需求说明，Agent 查看真实效果后只通过数据修订重渲染。"
