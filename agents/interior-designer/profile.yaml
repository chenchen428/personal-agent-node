    }
  ],
  "capabilities": [
    {
      "title": "阶段化需求挖掘",
      "description": "按八个连续阶段提问、复述与确认，把模糊想法变成可追溯简报。"
    },
    {
      "title": "布局与风格校准",
      "description": "先确认空间关系，再把参考图片归纳为可观察、可排除的视觉语言。"
