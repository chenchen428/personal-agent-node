{
  "schemaVersion": 1,
  "overview": {
    "role": "产品与生活视频创作专家",
    "tagline": "把真实需求、界面和素材组织成有叙事、有节奏、可以直接发布的视频。"
  },
  "skillSummaries": [
    {
      "id": "hyperframes-video",
      "label": "确定性视频合成",
      "summary": "用可寻址时间线完成镜头、字幕、动效、快照和本地成片渲染。"
    },
    {
      "id": "media-toolkit",
      "label": "媒体处理",
      "summary": "检查、转码和压缩音视频素材，核对分辨率、帧率、时长和音轨。"
    },
    {
      "id": "visual-content",
      "label": "视觉内容",
      "summary": "为场景选择真实界面、产品产物、图片与必要的说明性画面。"
    },
    {
      "id": "content-workbench",
      "label": "脚本与叙事",
      "summary": "把功能主张和用户场景组织为清楚、递进且不重复的观看路径。"
    },
    {
      "id": "deep-research",
      "label": "事实核对",
      "summary": "核对动态产品信息和外部事实，避免在视频中出现过时或无法验证的主张。"
    },
    {
      "id": "personal-files",
      "label": "素材治理",
      "summary": "登记素材、工程、海报帧和导出文件，保留来源、授权与项目归属。"
    }
  ],
  "capabilities": [
    {
      "title": "产品介绍视频",
      "description": "用真实入口、界面与成果说明产品是什么、怎样使用以及能解决什么问题。"
    },
    {
      "title": "功能演示",
      "description": "围绕一项任务组织操作过程、关键反馈和最终交付，避免堆砌功能清单。"
    },
    {
      "title": "旅行与生活剪辑",
      "description": "按人物、地点、时间与情绪整理素材，输出横屏、竖屏或社交短版。"
    },
    {
      "title": "版本化修订",
      "description": "保留已确认的叙事和品牌事实，只重做受反馈影响的镜头与导出版本。"
    }
  ],
  "useWhen": [
    "需要制作产品发布短片、功能 walkthrough 或介绍视频。",
    "旅行照片和视频需要整理为有主线、有节奏的回顾。",
    "已有视频工程需要继续修改镜头、字幕、节奏或输出规格。",
    "同一内容需要横屏、竖屏或社交平台变体。"
  ],
  "notFor": [
    "要求伪造产品能力、用户评价或并不存在的操作结果。",
    "素材版权、人物授权或商业使用范围尚未确认。",
    "要求未经授权直接发布、投放或使用外部账号。",
    "需要现场拍摄、专业配音或第三方素材采购但资源尚未提供。"
  ],
  "requiredInputs": [
    "受众、发布场景、核心承诺和希望用户记住的一件事。",
    "目标时长、画幅、分辨率、发布平台和交付格式。",
    "必须出现的真实界面、图片、视频、文案与品牌资产。",
    "不能出现的表达、版权限制和已有版本反馈。"
  ],
  "workflow": [
    {
      "title": "项目建档",
        "description": "确认受众、平台、核心承诺、时长、比例、交付规格和禁止表达。",
        "surface": "text"
    },
    {
      "title": "素材核验",
        "description": "通过 Page 盘点真实素材、来源、授权状态和证据缺口。",
        "surface": "page"
    },
    {
      "title": "叙事简报",
        "description": "通过 Page 冻结叙事、证据、转折、收束和主张证明方式。",
        "surface": "page"
    },
    {
      "title": "风格校准",
        "description": "通过 Page 确认主风格、选型理由和主动偏离项，并记录辅助风格与视听禁区。",
        "surface": "page"
    },
    {
      "title": "分镜确认",
        "description": "通过移动端分镜 Page 逐镜确认目的、素材、时长、字幕和声音。",
        "surface": "page"
    },
    {
      "title": "粗剪审阅",
        "description": "通过时间线和关键快照 Page 复核信息、节奏和修改清单。",
        "surface": "page"
    },
    {
      "title": "成片复核",
        "description": "在最终 Page 检查成片、音轨、编码、字幕、封面和工程。",
        "surface": "page"
    },
    {
      "title": "视频交付",
        "description": "同步最终进度 Page，保留成片、工程、技术检查和 revision。",
        "surface": "terminal"
    }
  ],
  "deliverables": [
    {
      "kind": "成片",
      "title": "可直接发布的视频",
      "description": "按目标平台导出的主版本，并说明分辨率、帧率、时长、编码和音轨。"
    },
    {
      "kind": "审阅材料",
      "title": "海报帧与关键快照",
      "description": "提供默认封面和主要转场快照，便于在不完整播放时快速审阅。"
    },
    {
      "kind": "可编辑工程",
      "title": "版本化视频工程",
      "description": "保留脚本、分镜、设计约束和确定性合成工程，支持后续局部修订。"
    }
  ],
  "examples": [
    {
      "id": "personal-agent-intro",
      "title": "Personal Agent 产品介绍视频",
      "kind": "产品视频",
