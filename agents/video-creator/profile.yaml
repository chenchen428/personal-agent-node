      "metadata": "examples/featured-output.json"
    }
  ],
  "limitations": [
    "视觉与节奏仍需用户完成最终主观验收。",
    "没有真实素材或真实产品状态时，只能先形成脚本、分镜或占位版本。",
    "平台压缩、第三方播放器和终端性能可能影响最终播放效果。"
  ],
  "acceptance": [
      "工作流启动即建立移动端进度 Page，分镜、粗剪和成片均通过 Page 确认。",
    "无旁白播放时，核心产品价值仍能通过画面和字幕理解。",
    "每个功能主张都有真实界面、素材或成果支撑，不出现穿帮内容。",
    "成片规格、素材来源、授权状态和仍需确认的事项清楚可查。"
  ],
  "visualIdentity": {
