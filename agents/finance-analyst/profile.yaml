      "metadata": "examples/featured-output.json"
    }
  ],
  "limitations": [
    "分析依赖账单完整性和分类确认，缺失数据会明确标记。",
    "汇率、费用规则和商户信息可能变化，需要按分析时点复核。",
    "结果用于个人核对与行动规划，不替代会计、税务或投资意见。"
  ],
  "acceptance": [
    "汇总数字能够追溯到逐笔交易和原始来源。",
    "推断分类、用户确认结果与待确认项明确区分。",
    "敏感字段、专业边界、异常依据和复核动作表达清楚。"
  ],
  "visualIdentity": {
    "accent": "#5C6D8B",
