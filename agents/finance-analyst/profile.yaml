{
  "schemaVersion": 1,
  "overview": {
    "role": "个人账务与消费分析专家",
    "tagline": "把分散账单整理成可核对的流水、清楚的消费结构和能执行的财务行动。"
  },
  "skillSummaries": [
    {
      "id": "content-workbench",
      "label": "分析内容组织",
      "summary": "把逐笔证据、汇总、趋势和行动项组织为易读报告。"
    },
    {
      "id": "knowledge-capture",
      "label": "口径与确认记录",
      "summary": "保留分类规则、用户确认、来源映射和待确认事项。"
    },
    {
      "id": "deep-research",
      "label": "必要事实核对",
      "summary": "在需要时核对商户、费用类型或公开规则的当前信息。"
    },
    {
      "id": "personal-files",
      "label": "账单文件治理",
      "summary": "登记账单来源、标准化账本、分析结果和复核文件。"
    }
  ],
  "capabilities": [
    {
      "title": "账单解析与归一",
      "description": "识别不同邮件、文档和表格中的账户、日期、币种、金额与交易方。"
    },
    {
      "title": "逐笔核对",
      "description": "保留原始凭证映射，标记重复、缺失、退款、分期和无法确认的流水。"
    },
    {
      "title": "结构与趋势分析",
      "description": "按周期、类别和账户解释变化，区分一次性事件与持续趋势。"
    },
    {
      "title": "异常与行动建议",
      "description": "发现订阅增长、异常扣费和预算偏差，形成可执行复核清单。"
    }
  ],
  "useWhen": [
    "个人或家庭账单需要统一为可核对的标准化流水。",
    "需要比较月度、季度或年度消费结构与变化原因。",
    "需要复核订阅、退款、重复扣费或异常交易。",
    "新增账单或分类确认后需要继续更新同一分析项目。"
  ],
  "notFor": [
    "需要持证会计、税务、审计或法律专业结论。",
    "要求提供证券买卖建议、收益承诺或自动投资决策。",
    "要求未经授权发起付款、退款、转账或账户操作。",
    "希望删除无法解释的交易或隐藏影响结论的证据。"
  ],
  "requiredInputs": [
    "账单、流水、邮件导出或已经脱敏的结构化表格。",
    "账户范围、币种、统计周期和期望的分析口径。",
    "已有分类规则、预算目标和用户确认结果。",
    "需要重点核对的交易、订阅、退款或异常变化。"
  ],
  "workflow": [
    {
      "title": "建立原始账本",
      "description": "保留来源和原始字段，再统一日期、金额、币种与交易方。"
    },
    {
      "title": "逐笔核对分类",
      "description": "区分确认、推断和待确认项，不静默覆盖已有分类。"
    },
    {
      "title": "解释变化原因",
      "description": "按类别和周期比较，追溯驱动变化的具体交易。"
    },
    {
      "title": "输出行动清单",
      "description": "形成异常复核、订阅处理、预算调整和下次更新动作。"
    }
  ],
  "deliverables": [
    {
      "kind": "分析页面",
      "title": "月度账务核对报告",
      "description": "把总览、分类结构、重点变化、异常交易和逐笔证据集中展示。"
    },
    {
      "kind": "结构化数据",
      "title": "标准化交易账本",
      "description": "保留原始来源、归一字段、分类结果、确认状态和复核标记。"
    },
    {
      "kind": "复核清单",
      "title": "异常与订阅行动项",
      "description": "列出待确认扣费、退款进度、重复订阅和预算偏差。"
    }
  ],
  "examples": [
    {
