<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:">
  <title>海报设计 Agent 代表产物</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#d8d5ce;color:#161714;font-family:Arial,"Microsoft YaHei",sans-serif}
    main{width:min(100%,390px);min-height:680px;margin:auto;background:#f5f1e8;overflow:hidden}
    header{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid #1f211e;font-size:10px}
    header strong{font-size:12px}.issue{font-family:monospace}
    .hero{position:relative;min-height:360px;padding:34px 22px;background:#c84e3a;color:#111}
    .hero small{display:block;width:max-content;border:1px solid #111;padding:5px 8px;font-size:9px}
    h1{max-width:310px;margin:70px 0 18px;font-family:Georgia,serif;font-size:52px;line-height:.98}
    .hero p{width:230px;margin:0;font-size:12px;line-height:1.65}
    .stamp{position:absolute;right:-20px;bottom:18px;width:128px;height:128px;display:grid;place-items:center;border:2px solid #111;border-radius:50%;font:700 10px/1.4 monospace;text-align:center;transform:rotate(-12deg)}
    .story{display:grid;grid-template-columns:96px 1fr;min-height:250px;border-top:1px solid #1f211e}
    .story>aside{display:flex;align-items:flex-end;padding:18px;border-right:1px solid #1f211e;background:#2e594e;color:#fff;font:10px/1.5 monospace}
    .story>section{padding:22px}
    .story h2{margin:0 0 18px;font:700 18px/1.2 Georgia,serif}
    .facts{display:grid;gap:12px}.facts div{display:grid;grid-template-columns:26px 1fr;gap:10px;border-top:1px solid #c9c4ba;padding-top:10px}
    .facts b{font:700 10px monospace;color:#c84e3a}.facts p{margin:0;font-size:10px;line-height:1.55}
    footer{display:flex;justify-content:space-between;padding:14px 20px;background:#171815;color:#f5f1e8;font-size:9px}
  </style>
</head>
<body><main>
  <header><strong>城市观察</strong><span class="issue">VOL. 08 / 2026</span></header>
  <section class="hero"><small>FIELD NOTES</small><h1>在城市里，重新发现慢下来</h1><p>八个微小观察，记录步行、街角与日常生活之间仍然存在的温度。</p><span class="stamp">WALK<br>LOOK<br>LISTEN</span></section>
  <section class="story"><aside>08 PAGES<br>3:4 SERIES<br>SOCIAL CARDS</aside><section><h2>一套能够连续阅读的视觉节奏</h2><div class="facts"><div><b>01</b><p>高识别封面在信息流中先建立主题和情绪。</p></div><div><b>02</b><p>正文页统一网格，同时允许每条观察有独立重点。</p></div><div><b>03</b><p>结尾页收束观点，并提供清晰但克制的行动提示。</p></div></div></section></section>
  <footer><span>POSTER DESIGN AGENT</span><span>1080 × 1440</span></footer>
</main></body>
</html>
